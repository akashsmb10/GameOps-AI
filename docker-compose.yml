services:
  api:
    build: .
    image: gameops-ai:latest
    ports: ["8000:8000"]
    env_file: [.env.example]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-}
  dashboard:
    image: gameops-ai:latest
    depends_on: [api]
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]
    env_file: [.env.example]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
  # Optional local LLM:  docker compose --profile llm up  then  docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  ollama:
