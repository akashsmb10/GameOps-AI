[project]
name = "gameops-ai"
version = "1.0.0"
description = "Agentic player-feedback intelligence: NLP, hybrid RAG and a LangGraph tool-calling agent over game reviews"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 180
target-version = "py311"
extend-exclude = ["artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S106", "S311", "S608", "B008", "E731"]  # asserts; "token" kwargs flagged as passwords; non-crypto RNG; SQL from whitelisted identifiers only; FastAPI Query defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"dashboard/*" = ["E402", "I001"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
